services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: subastaya-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=TuPassword123!
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
